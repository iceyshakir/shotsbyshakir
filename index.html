<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Photography portfolio by Shakir Nisar.">
    <title>Work | shotsbyshakir</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="nav">
      <a class="logo" href="index.html">shotsbyshakir</a>
      <nav aria-label="Main navigation">
        <a href="index.html" aria-current="page">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>
    <main>
      <section class="hero">
        <div>
          <p class="eyebrow">Shakir Nisar / Photography</p>
          <h1>Finding the beauty in the everyday.</h1>
          <p class="intro">Portraits, places, and the moments in between.</p>
        </div>
      </section>
      <section class="gallery" aria-label="Selected photographs">
        <figure class="photo-card">
          <div class="photo-frame">
            <span class="photo-placeholder">Add images/photo-1.jpg</span>
            <img src="images/photo-1.JPG" alt="Portrait photograph" loading="lazy">
          </div>
          <figcaption>
            <span>Portraits</span>
            <span>01 / 04</span>
          </figcaption>
        </figure>
        <figure class="photo-card">
          <div class="photo-frame">
            <span class="photo-placeholder">Add images/photo-2.jpg</span>
            <img src="images/photo-2.jpg" alt="Street photograph" loading="lazy">
          </div>
          <figcaption>
            <span>Street</span>
            <span>02 / 04</span>
          </figcaption>
        </figure>
        <figure class="photo-card">
          <div class="photo-frame">
            <span class="photo-placeholder">Add images/photo-3.jpg</span>
            <img src="images/photo-3.JPG" alt="Landscape photograph" loading="lazy">
          </div>
          <figcaption>
            <span>Photoshoots</span>
            <span>03 / 04</span>
          </figcaption>
        </figure>
        <figure class="photo-card">
          <div class="photo-frame">
            <span class="photo-placeholder">Add images/photo-4.jpg</span>
            <img src="images/photo-4.jpg" alt="Lifestyle photograph" loading="lazy">
          </div>
          <figcaption>
            <span>Moments</span>
            <span>04 / 04</span>
          </figcaption>
        </figure>
      </section>
    </main>
    <footer class="footer">
      <span>© 2026 shotsbyshakir</span>
      <a href="contact.html">Get in touch ↗</a>
    </footer>

</html>
